name: Keep Render Backend Alive

on:
  schedule:
    # Every 14 minutes: prevents Render's 15-minute free-tier spin-down, and because
    # /ready queries the database it also keeps the free Supabase project from pausing.
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend readiness endpoint (touches Supabase)
        run: |
          URL=https://interconnect-backend-2c5e.onrender.com/ready

          # Retry once to ride out a Render cold start.
          for attempt in 1 2; do
            STATUS_CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $attempt: HTTP $STATUS_CODE $(cat response.json 2>/dev/null)"
            [ "$STATUS_CODE" -eq 200 ] && exit 0
            sleep 20
          done

          # Fail so GitHub emails you: 503 means the database is unreachable
          # (e.g. the Supabase project was paused or deleted).
          echo "::error::Backend not ready (HTTP $STATUS_CODE)"
          exit 1
